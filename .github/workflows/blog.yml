name: Latest blog posts

# Populates the BLOG-POST-LIST markers in README.md from your RSS/Atom feed.
#
# BEFORE ENABLING:
#   1. Confirm your feed URL below (feed_list). Common paths: /rss.xml, /feed,
#      /index.xml, /atom.xml. If hhristov.info has no feed yet, leave this
#      workflow disabled — the README section falls back to a static line.
#   2. Then let it run (schedule or "Run workflow" in the Actions tab).

on:
  schedule:
    - cron: "0 4 * * *"   # daily at 04:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-readme:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Pull latest posts into README
        uses: gautamkrishnar/blog-post-workflow@v1
        with:
          # TODO: confirm this is your real feed URL
          feed_list: "https://hhristov.info/index.xml"
          max_post_count: 5
          commit_message: "chore: refresh latest blog posts"
